<form method="post" action="{% url 'main:toggle_star' experience.id %}" class="star-form">
    {% csrf_token %}

    <button type="submit"
            class="button button-star{% if user in experience.starred_by.all %} is-starred{% endif %}"
            title="{% if user in experience.starred_by.all %}Unstar pengalaman ini{% else %}Star pengalaman ini{% endif %}">
        <span aria-hidden="true">★</span>

        {% if user in experience.starred_by.all %}
            Unstar
        {% else %}
            Star
        {% endif %}

        <span class="star-count">{{ experience.starred_by.count }}</span>
    </button>
</form>
